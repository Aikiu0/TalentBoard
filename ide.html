<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="ide.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- MENU -->

        <aside class="sidebar">

            <div class="profile">

                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Perfil">

            </div>

            <div class="menu">

                <button><i class="fa-solid fa-chevron-right"></i></button>

                <button><i class="fa-solid fa-chevron-right"></i></button>

                <button><i class="fa-solid fa-chevron-right"></i></button>

            </div>

            <div class="logout">

                <button>

                    <i class="fa-solid fa-right-from-bracket"></i>

                </button>

            </div>

        </aside>

        <!-- CONTENIDO -->

        <main class="content">

            <section>

                <h2>Asesorías</h2>

                <table>

                    <thead>

                        <tr>

                            <th>Nombre</th>
                            <th>Materia</th>
                            <th>Horario</th>
                            <th>Estado</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>Juan</td>
                            <td>Redes</td>
                            <td>10:00</td>
                            <td>Libre</td>

                        </tr>

                        <tr>

                            <td>Ana</td>
                            <td>Java</td>
                            <td>12:00</td>
                            <td>Libre</td>

                        </tr>

                        <tr>

                            <td>Carlos</td>
                            <td>Web</td>
                            <td>2:00</td>
                            <td>Libre</td>

                        </tr>

                    </tbody>

                </table>

            </section>

            <section>

                <h2>Mis asesorías</h2>

                <table>

                    <thead>

                        <tr>

                            <th>Nombre</th>
                            <th>Materia</th>
                            <th>Horario</th>
                            <th>Estado</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>Pedro</td>
                            <td>POO</td>
                            <td>8:00</td>
                            <td>Activa</td>

                        </tr>

                        <tr>

                            <td>María</td>

                        </tr>

                        <tr>

                            <td>Sofía</td>

                        </tr>

                    </tbody>

                </table>

            </section>

        </main>

    </div>

</body>

</html>
