            <path d="M128 205 Q131 195 128 185" stroke="#8c8275" stroke-width="1" fill="none"/>

            <path d="M210 248 L175 175 L245 175 L275 248 Z" fill="#fdfcfb" stroke="#8c8275" stroke-width="1"/>
            <circle cx="225" cy="210" r="4" stroke="#8c8275" stroke-width="1" fill="none"/>
        </svg>
    </div>

    <!-- RIGHT: Formulario -->
    <div class="form-side">
        <div class="form-wrapper">

            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z"/>
                </svg>
            </div>

            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to continue</p>

            <form id="loginForm">
                <div class="input-group">
                    <i class="fa-regular fa-user field-icon"></i>
                    <input type="text" id="login-correo" placeholder="Email or username" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <i class="fa-solid fa-eye toggle-password" data-target="login-password"></i>
                </div>

                <div class="extra-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign in</button>

                <div class="separator">or</div>

                <button type="button" class="btn-google">
                    <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="Google Logo">
                    Continue with Google
                </button>

                <div class="switch-text">
                    Don't have an account? <a onclick="navegarA('register')">Sign up</a>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
function init_login() {
    // ---- Toggle mostrar/ocultar contraseña ----
    document.querySelectorAll("#loginForm .toggle-password").forEach(function (icon) {
        icon.addEventListener("click", function () {
            const input = document.getElementById(this.dataset.target);
            if (!input) return;
            if (input.type === "password") {
                input.type = "text";
                this.classList.remove("fa-eye");
                this.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                this.classList.remove("fa-eye-slash");
                this.classList.add("fa-eye");
            }
        });
    });

    // ---- Envío del formulario ----
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const correo    = document.getElementById("login-correo").value.trim();
        const password  = document.getElementById("login-password").value.trim();
        const btnSubmit = this.querySelector(".btn-submit");

        btnSubmit.textContent = "Signing in...";
        btnSubmit.disabled = true;

        try {
            const res = await fetch(`${API_URL}/api/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ correo, password })
            });
            const data = await res.json();

            if (res.ok) {
                alert(`¡Bienvenido! Rol: ${data.rol}`);
                // Cuando crees el dashboard, navega así:
                // navegarA("dashboard");
            } else {
                alert(data.error || "Error al iniciar sesión");
            }
        } catch (err) {
            alert("No se pudo conectar con el servidor. ¿Está corriendo Flask?");
            console.error(err);
        } finally {
            btnSubmit.textContent = "Sign in";
            btnSubmit.disabled = false;
        }
    });
}
</script>
